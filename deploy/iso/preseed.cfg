#_preseed_V1
# Answers for the Debian installer on the UrsaNAS ISO (Debian 13).
#
# What the person installing is asked:
#   - language, location (time zone) and keyboard
#   - host name
#   - the network settings, only when "static IP address" was picked in the boot menu
#   - the system disk size (the "UrsaNAS setup" step, see ursanas-setup.postinst)
#   - the user account (it gets sudo: the root account is disabled)
#   - one last confirmation before the disk is written
# Everything else below has an answer, so the installer does not ask.

### Time
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network
# The first network card that has a link. DHCP unless the boot menu entry disabled it (netcfg/disable_autoconfig).
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 30
# The machine name, the first user and the disk size are asked on the single "UrsaNAS setup" page (ursanas-setup).
d-i netcfg/get_domain string
d-i netcfg/get_domain seen true
d-i netcfg/wireless_wep string

### Package mirror: Debian's own content delivery network, no proxy
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

### Account: no root password, the first user administers the machine with sudo
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i user-setup/encrypt-home boolean false

### Disk: the layout and the disk are decided by ursanas-setup.postinst
d-i partman-auto/method string regular
d-i partman/early_command string sh /ursanas/partman-early.sh
d-i partman-auto/choose_recipe select ursanas
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
# partman/confirm is left unanswered on purpose: the installer shows what it is going to write and asks once.

### Software: SSH, sudo and the plain packages UrsaNAS needs (all in Debian's main component), no desktop, no upgrade
# ZFS, Docker, virtual machines and rclone need more care: late.sh installs them with ursanas-deps.sh.
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo curl ca-certificates openssl acl samba smbclient smartmontools xfsprogs btrfs-progs exfatprogs cifs-utils nfs-common nfs-kernel-server vsftpd fuse3
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i pkgsel/install-language-support boolean false
d-i popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### End: the UrsaNAS files go in place, then the machine restarts
d-i preseed/late_command string sh /ursanas/late.sh
d-i finish-install/reboot_in_progress note
